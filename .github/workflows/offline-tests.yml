name: Offline tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'fix/cache-fallback-*']

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in extension/*.js extension/lib/*.js scripts/*.mjs scripts/lib/*.mjs tests/*.mjs; do
            node --check "$file" || exit
          done
